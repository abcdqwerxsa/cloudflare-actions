#:schema node_modules/wrangler/config-schema.json
name = "cloudflare-actions"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (Next.js export output)
[assets]
directory = "./out"
binding = "ASSETS"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "cloudflare-actions-db"
database_id = "a361ed87-4f27-4b23-9658-fec49113df85"

# Durable Objects
[durable_objects]
bindings = [
  { name = "RUNNER_CONTAINER", class_name = "RunnerContainer" }
]

# Container configuration - linked to RunnerContainer DO
[[containers]]
class_name = "RunnerContainer"
image = "./Dockerfile"
instance_type = "lite"

# Cron triggers - runs every minute to check for scheduled tasks
[triggers]
crons = ["* * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunnerContainer"]

# Environment variables
[vars]
API_KEY = "change-me-in-production"
AUTH_PASSWORD = "change-me-in-production"
AUTH_SECRET = "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
WORKER_API_URL = "https://cloudflare-actions.jeanpaul20020519.workers.dev"

# Development overrides
[dev]
port = 8787
